spring:
  application:
    name: auth-service

  config:
    import: optional:file:../../../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_AUTH_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration