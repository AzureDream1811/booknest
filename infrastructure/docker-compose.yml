services:
  booknest-db:
    image: postgres:17
    container_name: booknest-db
    restart: unless-stopped
    env_file:
      - ../.env

    environment:
      POSTGRES_DB: booknest_auth

    ports:
      - "${POSTGRES_AUTH_PORT:-5433}:5432"

    volumes:
      - booknest-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_AUTH_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  booknest:
    build:
      context: ..
      dockerfile: backend/booknest/Dockerfile
    container_name: booknest
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      booknest-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booknest-db:5432/booknest_auth
    ports:
      - "${BOOKNEST_PORT:-8080}:8080"

volumes:
  booknest-db-data: